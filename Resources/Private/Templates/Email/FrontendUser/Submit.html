{namespace postmaster=Madj2k\Postmaster\ViewHelpers}
{namespace rkw=RKW\RkwCompetition\ViewHelpers}
<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:postmaster="http://typo3.org/ns/Madj2k/Postmaster/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Email/{mailType}" />


<!-- PLAINTEXT -->
<f:section name="Plaintext">
<postmaster:email.translate key="templates_email_frontendUser_submit.headline" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" arguments="{0 : frontendUser.firstName, 1: frontendUser.lastName}" />

<postmaster:email.translate key="templates_email_frontendUser_submit.text1" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" />
{register.competition.title}
<postmaster:email.translate key="templates_email_frontendUser_submit.text2" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" />

=============================================================
<postmaster:email.translate key="templates_email_frontendUser_submit.showHeadline" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" />
<postmaster:email.translate key="templates_email_frontendUser_submit.text3" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" />
<postmaster:email.uri.page absolute="true" pageUid="{loginPid}" />
</f:section>

<!-- HTML -->
<f:section name="Html">
	<h1><postmaster:email.translate key="templates_email_frontendUser_submit.headline" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" arguments="{0 : frontendUser.firstName, 1: frontendUser.lastName}" /></h1>
	<p>
		<postmaster:email.translate key="templates_email_frontendUser_submit.text1" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" /><br>
		<strong>{register.competition.title}</strong><br>
		<postmaster:email.translate key="templates_email_frontendUser_submit.text2" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" />
	</p>

	<h2><postmaster:email.translate key="templates_email_frontendUser_submit.showHeadline" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" /></h2>
	<p>
		<a href="<postmaster:email.uri.page absolute='true' pageUid='{loginPid}' />" target="_blank"><postmaster:email.translate key="templates_email_frontendUser_submit.text3" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" /></a>
	</p>
</f:section>
