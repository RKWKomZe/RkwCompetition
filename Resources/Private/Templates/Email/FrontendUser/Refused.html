{namespace postmaster=Madj2k\Postmaster\ViewHelpers}
{namespace rkw=RKW\RkwCompetition\ViewHelpers}
<f:layout name="Email/{mailType}" />


<!-- PLAINTEXT -->
<f:section name="Plaintext">
	<postmaster:email.translate key="templates_email_frontendUser_refused.headline" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" arguments="{0 : frontendUser.firstName, 1: frontendUser.lastName}" />

	<postmaster:email.translate key="templates_email_frontendUser_refused.text1" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" arguments="{0 : register.competition.title}" />
	<f:if condition="{register.adminRefusedText}">
		<br />
		<strong><postmaster:email.translate key="templates_email_frontendUser.commentPrefix" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" /></strong>
		{register.adminRefusedText}
	</f:if>

	=============================================================
	<postmaster:email.translate key="templates_email_frontendUser_refused.showHeadline" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" />
	<postmaster:email.translate key="templates_email_frontendUser_refused.text3" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" />
	<postmaster:email.uri.page absolute="true" pageUid="{loginPid}" />
</f:section>

<!-- HTML -->
<f:section name="Html">
	<h1><postmaster:email.translate key="templates_email_frontendUser_refused.headline" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" arguments="{0 : frontendUser.firstName, 1: frontendUser.lastName}" /></h1>
	<p>
		<postmaster:email.translate key="templates_email_frontendUser_refused.text1" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" arguments="{0 : register.competition.title}" />
	</p>
	<f:if condition="{register.adminRefusedText}">
		<p>
			<strong><postmaster:email.translate key="templates_email_frontendUser.commentPrefix" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" /></strong><br />
			<f:format.nl2br>{register.adminRefusedText}</f:format.nl2br>
		</p>
	</f:if>

	<h2><postmaster:email.translate key="templates_email_frontendUser_refused.showHeadline" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" /></h2>
	<p>
		<a href="<postmaster:email.uri.page absolute='true' pageUid='{loginPid}' />" target="_blank"><postmaster:email.translate key="templates_email_frontendUser_refused.text3" languageKey="{queueRecipient.languageCode}" extensionName="rkwCompetition" /></a>
	</p>
</f:section>
