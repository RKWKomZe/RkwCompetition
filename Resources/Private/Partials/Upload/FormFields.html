<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

	<div class="form__field width100">
		<label class="form-label" for="abstract">
			<f:translate key="tx_rkwcompetition_domain_model_upload.abstract" />
		</label>

		<f:if condition="{register.upload.abstract}">
			<f:then>
				<div class="form__field-file-info">
					<f:link.typolink
							parameter="{register.upload.abstract.originalResource.publicUrl}"
							target="_blank"
							title="Download"
							absolute="true"
					>
						{register.upload.abstract.originalResource.name}
					</f:link.typolink>
					<f:link.action
							class="btn btn--secondary btn--small"
							action="delete"
							arguments="{register: register, property: 'abstract', fileReference: register.upload.abstract}"
					>
						<f:translate key="tx_rkwcompetition_fluid.templates_upload_edit.delete" />
					</f:link.action>
				</div>
			</f:then>
			<f:else>
				<f:form.upload property="upload.fileAbstractUploadArray" id="abstract" additionalAttributes="{accept: '.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document'}" />
			</f:else>
		</f:if>
	</div>

	<div class="form__field width100">
		<label class="form-label" for="full">
			<f:translate key="tx_rkwcompetition_domain_model_upload.full" />
		</label>

		<f:if condition="{register.upload.full}">
			<f:then>
				<div class="form__field-file-info">
					<f:link.typolink
							parameter="{register.upload.full.originalResource.publicUrl}"
							target="_blank"
							title="Download"
							absolute="true"
					>
						{register.upload.full.originalResource.name}
					</f:link.typolink>
					<f:link.action
							class="btn btn--secondary btn--small"
							action="delete"
							arguments="{register: register, property: 'full', fileReference: register.upload.full}"
					>
						<f:translate key="tx_rkwcompetition_fluid.templates_upload_edit.delete" />
					</f:link.action>
				</div>
			</f:then>
			<f:else>
				<f:form.upload property="upload.fileFullUploadArray" id="full" additionalAttributes="{accept: '.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document'}" />
			</f:else>
		</f:if>
	</div>

</html>
