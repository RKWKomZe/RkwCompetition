<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:rkw="http://typo3.org/ns/RKW/RkwCompetition/ViewHelpers"
    data-namespace-typo3-fluid="true">

    <f:if condition="{register.competition}">

        <f:if condition="<rkw:isDateWithinDeadline date='{register.competition.registerEnd}' />">
            <f:variable name="regStatus" value="<rkw:registerStatus register='{register}' />" />
            <f:if condition="{regStatus} == 300 || {regStatus} == 500">
                <div class="system-message system-message--scroll" role="alert">
                    <p class="system-message__item system-message__item--severity0">
                        <f:translate key="tx_rkwcompetition_fluid.partials_participant_options.registrationComplete" />
                    </p>
                </div>
            </f:if>
        </f:if>

        <div class="flex space-between valign-center">
            <div class="btn-list">
                <!-- show competition -->
                <f:link.action
                    pageUid="{settings.competitionPid}"
                    target="_blank"
                    class="btn btn--primary"
                    controller="Competition"
                    action="show"
                    arguments="{competition : register.competition}"
                >
                    <f:translate key="tx_rkwcompetition_fluid.partials_participant_options.competitionShow" />
                </f:link.action>


                <f:comment><!-- ViewHelper returns true if reg time for competition is still running --></f:comment>
                <f:if condition="<rkw:isDateWithinDeadline date='{register.competition.registerEnd}' />">

                    <f:if condition="{regStatus} < 300 || {regStatus} == 400">
                        <f:link.action class="btn btn--primary" controller="Upload" action="edit" arguments="{register : register}">
                            <f:translate key="tx_rkwcompetition_fluid.partials_participant_options.registerUpload" />
                        </f:link.action>
                    </f:if>
                </f:if>
            </div>

            <f:comment><!-- ViewHelper returns true if reg time for competition is still running --></f:comment>
            <f:if condition="<rkw:isDateWithinDeadline date='{register.competition.registerEnd}' />">
                <f:if condition="{regStatus} < 300 || {regStatus} == 400">
                    <div class="btn-list">
                        <f:link.action
                                class="btn btn--primary"
                                controller="Register"
                                action="submitQuestion"
                                arguments="{register : register}"
                        >
                            <f:translate key="tx_rkwcompetition_fluid.partials_participant_options.submit" />
                        </f:link.action>
                    </div>
                </f:if>
            </f:if>
        </div>
    </f:if>
</html>
