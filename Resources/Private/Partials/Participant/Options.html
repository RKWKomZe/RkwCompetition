<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:rkw="http://typo3.org/ns/RKW/RkwCompetition/ViewHelpers"
    data-namespace-typo3-fluid="true">

    <f:if condition="{register.competition}">

        <div class="flex space-between valign-center">
            <div class="btn-list">
                <f:comment><!-- ViewHelper returns true if reg time for competition is still running --></f:comment>
                <f:if condition="<rkw:isDateWithinDeadline date='{register.competition.registerEnd}' />">

                    <f:if condition="{regStatus} == 100 || {regStatus} == 400">
                        <f:link.action class="btn btn--secondary" controller="Upload" action="edit" arguments="{register : register}">
                            <f:if condition="{register.upload.abstract} || {register.upload.full}">
                                <f:then>
                                    <f:translate key="tx_rkwcompetition_fluid.partials_participant_options.registerUploadEdit" />
                                </f:then>
                                <f:else>
                                    <f:translate key="tx_rkwcompetition_fluid.partials_participant_options.registerUpload" />
                                </f:else>
                            </f:if>
                        </f:link.action>
                    </f:if>
                </f:if>
            </div>

            <f:comment><!-- ViewHelper returns true if reg time for competition is still running --></f:comment>
            <f:if condition="<rkw:isDateWithinDeadline date='{register.competition.registerEnd}' />">
                <f:if condition="{regStatus} == 100 || {regStatus} == 400">
                    <div class="btn-list">
                        <f:link.action
                                class="btn btn--primary"
                                controller="Register"
                                action="submitQuestion"
                                arguments="{register : register}"
                        >
                            <f:translate key="tx_rkwcompetition_fluid.partials_participant_options.submit" />
                        </f:link.action>
                    </div>
                </f:if>
            </f:if>
        </div>
    </f:if>
</html>
